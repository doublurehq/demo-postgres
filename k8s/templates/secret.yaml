apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database | quote }}
  POSTGRES_USER: {{ .Values.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" .Values.user .Values.password .Release.Name .Values.database | quote }}
